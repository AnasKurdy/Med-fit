<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Med Fit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16291c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<title>Med Fit — متابعة المرضى والعملاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EFE7; --surface:#FFFFFF; --surface-2:#FBF7F0;
  --ink:#172a25; --muted:#6c7d77; --faint:#9aa8a3;
  --primary:#13564b; --primary-2:#1d7163; --primary-soft:#e4efeb;
  --accent:#d98e48; --accent-soft:#f7ecdd;
  --good:#2c8a6e; --good-soft:#e2f1ec;
  --watch:#bf8420; --watch-soft:#f7eed8;
  --alert:#c0442d; --alert-soft:#f8e4de;
  --brand-dark:#16291c; --brand-dark2:#1e3626; --brand-green:#5aad30; --brand-green-d:#4a9127; --brand-cream:#ece7d3;
  --fit:#4a9127; --fit-soft:#e7f2dd;
  --border:rgba(19,86,75,.12); --border-2:rgba(19,86,75,.07);
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --sh:0 1px 2px rgba(19,86,75,.05),0 8px 24px rgba(19,86,75,.07);
  --sh-sm:0 1px 2px rgba(19,86,75,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Readex Pro',system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;
  box-shadow:0 0 80px rgba(19,86,75,.06)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;width:100%;color:var(--ink);
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:11px 13px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary-2)}
label{display:block;font-size:12.5px;color:var(--muted);margin:0 2px 6px;font-weight:500}
.field{margin-bottom:13px}
.row{display:flex;gap:10px}.row>*{flex:1}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.center{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--primary);color:#fff;font-weight:600;font-size:15px;
  padding:13px 18px;border-radius:999px;width:100%;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--primary-soft);color:var(--primary)}
.btn.accent{background:var(--accent)}
.btn.line{background:transparent;border:1.5px solid var(--border);color:var(--ink)}
.btn.sm{padding:9px 14px;font-size:13.5px;width:auto}
.btn.danger{background:var(--alert-soft);color:var(--alert)}
.btn.wa{background:#25a35a;color:#fff}
.btn.fit{background:var(--fit)}
.wo-day{border:1px solid var(--border-2);border-radius:var(--r-md);background:var(--surface);padding:14px;margin-bottom:12px}
.wo-day-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.wo-day-h .ic{width:34px;height:34px;border-radius:10px;background:var(--fit-soft);color:var(--fit);display:grid;place-items:center;flex:none}
.wo-ex{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-2);font-size:14px}
.wo-ex:last-child{border:none}
.wo-ex .en{flex:1}.wo-ex .em{font-size:11.5px;color:var(--muted)}
.setgrid{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.setbox{background:var(--surface-2);border:1px solid var(--border-2);border-radius:9px;padding:6px 8px;text-align:center;min-width:58px}
.setbox .sl{font-size:10px;color:var(--faint)}
.setbox input{padding:4px;text-align:center;border:none;background:transparent;font-weight:600;font-size:14px}
.setbox .sw{font-size:9px;color:var(--faint)}
.prev-hint{font-size:11px;color:var(--fit);margin-top:2px}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:var(--brand-dark);color:var(--brand-cream);
  padding:16px 18px 18px;overflow:hidden}
.hdr::before{content:"";position:absolute;inset:-40% -10% auto auto;width:240px;height:240px;
  background:radial-gradient(circle,rgba(90,173,48,.35),transparent 65%);pointer-events:none}
.brand .logomark{width:36px;height:36px;flex:none}
.wordmark{font-weight:600;letter-spacing:4px;font-size:19px;color:var(--brand-cream)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;position:relative}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.16);
  display:grid;place-items:center}
.brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.3px}
.brand .sub{font-size:11px;opacity:.75;margin-top:-2px}
.chip-role{font-size:11.5px;background:rgba(255,255,255,.16);padding:5px 11px;border-radius:999px;
  display:flex;align-items:center;gap:6px}
.sync-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.14);
  color:var(--brand-cream);display:grid;place-items:center;flex:none}
.sync-btn svg{width:16px;height:16px}
.sync-btn.spin svg{animation:spin .7s linear}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.hdr-ctx{position:relative;margin-top:14px}

/* content */
.wrap{padding:18px 16px 110px}
.card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--sh-sm);
  border:1px solid var(--border-2);padding:16px;margin-bottom:14px}
.card.flat{box-shadow:none}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);margin:22px 4px 11px;
  display:flex;align-items:center;gap:7px}
.sec-title:first-child{margin-top:4px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:11.5px;padding:4px 10px;border-radius:999px;background:var(--surface-2);
  color:var(--muted);font-weight:500;border:1px solid var(--border-2)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.watch{background:var(--watch-soft);color:var(--watch);border-color:transparent}
.chip.alert{background:var(--alert-soft);color:var(--alert);border-color:transparent}
.chip.pri{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:#b06a1f;border-color:transparent}

.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.good{background:var(--good)}.dot.watch{background:var(--watch)}.dot.alert{background:var(--alert)}

/* patient list */
.plist{display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--sh-sm);
  border:1px solid var(--border-2);padding:15px;display:block;text-align:right;width:100%;
  transition:transform .08s}
.pcard:active{transform:scale(.99)}
.pcard.flagged{border-color:var(--alert);box-shadow:0 0 0 1px var(--alert-soft)}
.pcard-top{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:13px;background:var(--primary-soft);color:var(--primary);
  display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.pcard-name{font-weight:600;font-size:15.5px}
.pcard-metrics{display:flex;gap:18px;margin-top:13px;padding-top:13px;border-top:1px solid var(--border-2)}
.metric{flex:1}
.metric .lbl{font-size:11px;color:var(--faint);margin-bottom:3px}
.metric .val{font-size:17px;font-weight:700;display:flex;align-items:baseline;gap:4px}
.metric .val small{font-size:11px;font-weight:500;color:var(--muted)}

/* big stat */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:15px;box-shadow:var(--sh-sm);
  border:1px solid var(--border-2)}
.stat .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .big{font-size:27px;font-weight:700;margin-top:6px;line-height:1.1}
.stat .big small{font-size:13px;font-weight:500;color:var(--muted)}
.stat .delta{font-size:12px;margin-top:5px;font-weight:500}
.delta.up{color:var(--alert)}.delta.down{color:var(--good)}.delta.flat{color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:13px;
  overflow-x:auto;margin-bottom:16px;border:1px solid var(--border-2)}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:13px;padding:8px 13px;border-radius:9px;white-space:nowrap;color:var(--muted);font-weight:500}
.tab.active{background:var(--surface);color:var(--primary);font-weight:600;box-shadow:var(--sh-sm)}

/* bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);display:flex;padding:8px 6px 18px;z-index:40}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--faint);font-size:10.5px;font-weight:500;padding:4px}
.bnav button.active{color:var(--primary)}
.bnav svg{width:22px;height:22px}

/* list rows */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-2)}
.lrow:last-child{border-bottom:none}
.lrow .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:var(--surface-2)}
.lrow .ic svg{width:18px;height:18px;color:var(--primary)}
.lrow .main{flex:1;min-width:0}
.lrow .t{font-weight:600;font-size:14px}
.lrow .s{font-size:12px;color:var(--muted)}
.lrow .end{text-align:left;font-weight:700;font-size:15px}

/* med */
.med{border:1px solid var(--border-2);border-radius:var(--r-sm);padding:12px;margin-bottom:9px;background:var(--surface)}
.med-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.med .nm{font-weight:600}
.med .ds{font-size:12.5px;color:var(--muted);margin-top:2px}
.statusbar{display:flex;gap:6px;margin-top:11px}
.sbtn{flex:1;font-size:11.5px;padding:7px;border-radius:8px;background:var(--surface-2);
  color:var(--muted);font-weight:500;border:1px solid transparent}
.sbtn.on-active{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.sbtn.on-reduced{background:var(--accent-soft);color:#b06a1f;border-color:var(--accent)}
.sbtn.on-stopped{background:var(--good-soft);color:var(--good);border-color:var(--good)}

/* quick log */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.qcard{background:var(--surface);border-radius:var(--r-md);padding:15px 13px;box-shadow:var(--sh-sm);
  border:1px solid var(--border-2);text-align:right;display:flex;flex-direction:column;gap:9px;
  transition:transform .08s}
.qcard:active{transform:scale(.98)}
.qcard .qic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.qcard .qic svg{width:20px;height:20px}
.qcard .qt{font-weight:600;font-size:14px}
.qcard .qs{font-size:11.5px;color:var(--muted)}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(23,42,37,.45);z-index:50;display:flex;
  align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;
  padding:8px 18px max(22px,env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .25s}
.sheet .grip{width:40px;height:4px;background:var(--border);border-radius:99px;margin:8px auto 16px}
.sheet h3{margin:0 0 16px;font-size:18px}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* banner */
.banner{border-radius:var(--r-md);padding:13px 15px;margin-bottom:14px;display:flex;gap:11px;align-items:flex-start;font-size:13px}
.banner svg{width:20px;height:20px;flex:none;margin-top:1px}
.banner.alert{background:var(--alert-soft);color:#8f2e1c}
.banner.note{background:var(--primary-soft);color:var(--primary)}
.banner.accent{background:var(--accent-soft);color:#9a5c1a}

/* segmented for selecting log type */
.seg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:11px;margin-bottom:13px}
.seg button{flex:1;padding:8px;font-size:12.5px;border-radius:8px;color:var(--muted);font-weight:500}
.seg button.active{background:var(--surface);color:var(--primary);font-weight:600;box-shadow:var(--sh-sm)}

.empty{text-align:center;color:var(--faint);padding:30px 10px;font-size:13.5px}
.svgwrap{direction:ltr;width:100%}
.toggle-cond{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.tcond{font-size:13px;padding:9px 14px;border-radius:999px;background:var(--surface-2);
  color:var(--muted);font-weight:500;border:1.5px solid transparent}
.tcond.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.progress-track{height:9px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;border-radius:99px;background:var(--good);transition:width .4s}
.fab{position:fixed;bottom:84px;left:50%;transform:translateX(calc(-50% + 200px));z-index:35;
  width:54px;height:54px;border-radius:18px;background:var(--accent);color:#fff;
  display:grid;place-items:center;box-shadow:0 8px 22px rgba(217,142,72,.4)}
.fab svg{width:26px;height:26px}
@media(max-width:520px){.fab{transform:none;left:auto;right:calc(50% - 240px + 18px)}}
.hint{font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.5}
.kvi{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border-2);font-size:14px}
.kvi:last-child{border:none}.kvi .k{color:var(--muted)}
.login-wrap{padding:60px 24px 40px;min-height:100vh;display:flex;flex-direction:column}
.login-logo{width:64px;height:64px;border-radius:20px;background:var(--primary);display:grid;place-items:center;margin:0 auto 18px;box-shadow:var(--sh)}
.roleopt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-md);
  border:1.5px solid var(--border);background:var(--surface);margin-bottom:12px;text-align:right;width:100%}
.roleopt .ic{width:46px;height:46px;border-radius:14px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.roleopt .t{font-weight:600}.roleopt .s{font-size:12.5px;color:var(--muted)}
.login-wrap.brand-bg{background:var(--brand-dark)}
.login-wrap.brand-bg::before{content:"";position:fixed;top:-10%;right:-15%;width:320px;height:320px;
  background:radial-gradient(circle,rgba(90,173,48,.22),transparent 65%);pointer-events:none}
.roleopt.dk{background:var(--brand-dark2);border-color:rgba(236,231,211,.14);color:var(--brand-cream);position:relative}
.roleopt.dk .ic{background:rgba(90,173,48,.16);color:var(--brand-green)}
.roleopt.dk .s{color:rgba(236,231,211,.6)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   Med Fit — تطبيق متابعة المرضى الأيضيين (سكر/ضغط/دهون) + التمارين
   ملف واحد · عربي RTL · تخزين دائم عبر Supabase (مستقل تمامًا عن Claude)
   ============================================================ */

const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const STORE_KEY="medfit:data:v1";
/* ---------- إعدادات Supabase (قاعدة بيانات مستقلة تمامًا عن Claude) ---------- */
const SUPABASE_URL="https://nlfqnldlmoaakmrofqzn.supabase.co";
const SUPABASE_KEY="sb_publishable_zveE7hpa73_BS8OnKaF2vw_KuO101lq";
const SB_TABLE="medfit_kv";
let DB=null;                 // كامل البيانات
let SESSION={role:null,pid:null,view:null};
let mem=null;                // احتياطي في الذاكرة لو فشل الاتصال
let CURRENT_RENDER=null;     // آخر شاشة معروضة، لإعادة رسمها بعد المزامنة
let SYNCING=false;
let FREEZE_SYNC=false;       // نجمّد المزامنة أثناء إدخال نشط (مثل تسجيل جلسة تمرين)

/* ---------- طبقة التخزين (Supabase) ---------- */
async function loadDB(){
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/${SB_TABLE}?k=eq.${encodeURIComponent(STORE_KEY)}&select=v`,{
      headers:{ "apikey":SUPABASE_KEY, "Accept":"application/json" }
    });
    if(!res.ok) throw new Error("http "+res.status);
    const rows=await res.json();
    if(rows&&rows.length&&rows[0].v) return rows[0].v;
  }catch(e){ if(mem) return mem; }
  return null;
}
async function saveDB(){
  mem=DB;
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/${SB_TABLE}`,{
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json",
        "Prefer":"resolution=merge-duplicates"
      },
      body:JSON.stringify([{k:STORE_KEY, v:DB, updated_at:new Date().toISOString()}])
    });
  }catch(e){}
}
/* سحب أحدث نسخة من البيانات (يُستخدم للمزامنة بين جهاز الطبيب وجهاز العميل) */
async function pullLatest(){
  try{
    const fresh=await loadDB();
    if(fresh) DB=fresh;
    return true;
  }catch(e){ return false; }
}
async function syncAndRedraw(manual){
  if(document.querySelector("#scrim")) return; // لا نقاطع نموذج إدخال مفتوح
  if(FREEZE_SYNC && !manual) return; // لا نقاطع تسجيل جلسة تمرين تلقائيًا
  if(SYNCING) return; SYNCING=true;
  const icon=$("#syncIcon"); if(icon&&manual) icon.classList.add("spin");
  await pullLatest();
  if(CURRENT_RENDER) CURRENT_RENDER();
  if(icon) setTimeout(()=>icon.classList.remove("spin"),400);
  SYNCING=false;
}

/* ---------- أدوات ---------- */
const $=s=>document.querySelector(s);
const app=()=>$("#app");
const uid=()=>Math.random().toString(36).slice(2,9);
const todayISO=()=>new Date().toISOString().slice(0,10);
function fmtD(iso){ if(!iso)return"—"; const d=new Date(iso+"T00:00"); return d.getDate()+" "+MONTHS[d.getMonth()]; }
function fmtDFull(iso){ if(!iso)return"—"; const d=new Date(iso+"T00:00"); return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear(); }
function daysAgo(iso){ if(!iso)return null; const d=Math.floor((Date.now()-new Date(iso+"T00:00"))/864e5);
  if(d<=0)return"اليوم"; if(d===1)return"أمس"; if(d<7)return"قبل "+d+" أيام"; if(d<30)return"قبل "+Math.floor(d/7)+" أسابيع"; return"قبل "+Math.floor(d/30)+" شهر"; }
const last=a=>(a&&a.length)?[...a].sort((x,y)=>x.date<y.date?-1:1).slice(-1)[0]:null;
const sortByDate=a=>[...(a||[])].sort((x,y)=>x.date<y.date?-1:1);
function esc(s){return(s==null?"":""+s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- منطق طبي / أعلام الأمان ---------- */
function glucoseStatus(v,type,t){ // mg/dL
  v=+v;
  if(type==="fasting"){
    if(v<70) return["alert","هبوط سكر"];
    if(v>250) return["alert","ارتفاع شديد"];
    if(v>=(t.fbgMin||80)&&v<=(t.fbgMax||130)) return["good","ضمن الهدف"];
    if(v>(t.fbgMax||130)) return["watch","مرتفع"];
    return["watch","منخفض"];
  }else{ // بعد الأكل / عشوائي
    if(v<70) return["alert","هبوط سكر"];
    if(v>300) return["alert","ارتفاع شديد"];
    if(v<=180) return["good","جيد"];
    if(v<=250) return["watch","مرتفع"];
    return["alert","مرتفع جدًا"];
  }
}
function bpStatus(s,d){
  s=+s;d=+d;
  if(s>=180||d>=120) return["alert","أزمة ضغط"];
  if(s>=140||d>=90) return["watch","مرتفع"];
  if(s>=130||d>=80) return["watch","مرتفع قليلًا"];
  if(s<90||d<60) return["watch","منخفض"];
  return["good","ضمن الهدف"];
}
function patientFlags(p){
  const fl=[];
  const g=last(p.logs.glucose);
  if(g){const[st]=glucoseStatus(g.value,g.type,p.targets); if(st==="alert")fl.push("سكر");}
  const b=last(p.logs.bp);
  if(b){const[st]=bpStatus(b.sys,b.dia); if(st==="alert")fl.push("ضغط");}
  const wl=last(p.workoutLogs);
  if(wl&&wl.pain==='strong') fl.push("ألم تمرين");
  return fl;
}
/* ---------- الستريك التحفيزي: عدد الأيام المتتالية بأي تسجيل ---------- */
function allLogDates(p){
  const s=new Set();
  ["glucose","bp","weight","lifestyle","wellbeing"].forEach(k=>(p.logs[k]||[]).forEach(x=>s.add(x.date)));
  (p.workoutLogs||[]).forEach(x=>s.add(x.date));
  return s;
}
function computeStreak(p){
  const dates=allLogDates(p);
  let streak=0;
  let d=new Date(todayISO()+"T00:00:00");
  const iso=x=>x.toISOString().slice(0,10);
  if(!dates.has(iso(d))) d.setDate(d.getDate()-1);
  while(dates.has(iso(d))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function medLoad(p){
  const a=p.meds.filter(m=>m.status==="active").length;
  const r=p.meds.filter(m=>m.status==="reduced").length;
  const s=p.meds.filter(m=>m.status==="stopped").length;
  return{active:a,reduced:r,stopped:s,total:p.meds.length};
}

/* ---------- رسم بياني SVG بسيط (خط + نطاق هدف) ---------- */
function lineChart(opts){
  const{values,bandMin,bandMax,color="#13564b",unit="",height=130}=opts;
  if(!values||values.length===0) return '<div class="empty">لا توجد قراءات بعد</div>';
  const W=320,H=height,pl=8,pr=8,pt=14,pb=22;
  const ys=values.map(v=>v.y);
  let mn=Math.min(...ys, bandMin!=null?bandMin:Infinity);
  let mx=Math.max(...ys, bandMax!=null?bandMax:-Infinity);
  if(mn===mx){mn-=5;mx+=5;}
  const pad=(mx-mn)*0.15||5; mn-=pad; mx+=pad;
  const n=values.length;
  const X=i=> n===1? W/2 : pl+(i/(n-1))*(W-pl-pr);
  const Y=v=> pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  let band="";
  if(bandMin!=null&&bandMax!=null){
    const y1=Y(bandMax),y2=Y(bandMin);
    band=`<rect x="0" y="${y1.toFixed(1)}" width="${W}" height="${(y2-y1).toFixed(1)}" fill="${color}" opacity="0.08"/>
      <line x1="0" y1="${y1.toFixed(1)}" x2="${W}" y2="${y1.toFixed(1)}" stroke="${color}" stroke-width="1" stroke-dasharray="3 4" opacity="0.35"/>
      <line x1="0" y1="${y2.toFixed(1)}" x2="${W}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="1" stroke-dasharray="3 4" opacity="0.35"/>`;
  }
  const pts=values.map((v,i)=>`${X(i).toFixed(1)},${Y(v.y).toFixed(1)}`).join(" ");
  const area=`${X(0).toFixed(1)},${(H-pb).toFixed(1)} `+pts+` ${X(n-1).toFixed(1)},${(H-pb).toFixed(1)}`;
  const dots=values.map((v,i)=>{
    const isLast=i===n-1;
    return `<circle cx="${X(i).toFixed(1)}" cy="${Y(v.y).toFixed(1)}" r="${isLast?4.5:3}" fill="${isLast?color:'#fff'}" stroke="${color}" stroke-width="2"/>`;
  }).join("");
  const lastV=values[n-1];
  const lbl=`<text x="${X(n-1).toFixed(1)}" y="${(Y(lastV.y)-9).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="${color}" font-family="Readex Pro">${lastV.y}${unit?" "+unit:""}</text>`;
  const xl=`<text x="${pl}" y="${H-6}" font-size="9.5" fill="#9aa8a3" font-family="Readex Pro">${values[0].x}</text>
    <text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="9.5" fill="#9aa8a3" font-family="Readex Pro">${lastV.x}</text>`;
  return `<div class="svgwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">
    ${band}
    <polygon points="${area}" fill="${color}" opacity="0.06"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${lbl}${xl}
  </svg></div>`;
}

async function init(){
  DB=await loadDB();
  if(!DB){ DB=seed(); await saveDB(); }
  // تطبيع للبيانات القديمة
  if(DB.clinic.whatsapp===undefined) DB.clinic.whatsapp="";
  if(DB.clinic.appUrl===undefined) DB.clinic.appUrl="";
  if(DB.clinic.autoLockMin===undefined) DB.clinic.autoLockMin=15;
  (DB.patients||[]).forEach(p=>{
    if(!p.workoutPlan) p.workoutPlan={split:"",days:[]};
    if(!p.workoutLogs) p.workoutLogs=[];
    if(!p.logs.adherence) p.logs.adherence=[];
    if(!p.logs.cardio) p.logs.cardio=[];
    if(!p.logs.nutrition) p.logs.nutrition=[];
    if(p.consentAccepted===undefined) p.consentAccepted=false;
    if(p.conditions&&p.conditions.vitaminD===undefined) p.conditions.vitaminD=false;
    if(p.conditions&&p.conditions.thyroid===undefined) p.conditions.thyroid=false;
    (p.meds||[]).forEach(m=>{ if(!m.history) m.history=[]; });
  });
  if(!handleAutoLog()) renderLogin();
  // مزامنة دورية خفيفة + عند العودة للتطبيق، بدون مقاطعة نموذج مفتوح أو إدخال نشط
  setInterval(()=>syncAndRedraw(false), 20000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) syncAndRedraw(false); });
  window.addEventListener("focus",()=>syncAndRedraw(false));
  // قفل تلقائي بعد عدم نشاط (لحماية بيانات المرضى إذا نُسي الجوال مفتوحًا) — يخص حساب الطبيب فقط
  ["click","touchstart","keydown","scroll"].forEach(ev=>document.addEventListener(ev,()=>{LAST_ACTIVITY=Date.now();},{passive:true}));
  setInterval(()=>{
    if(SESSION.role!=="doctor") return;
    const mins=DB.clinic.autoLockMin;
    if(!mins || mins<=0) return;
    if(Date.now()-LAST_ACTIVITY > mins*60000){ renderLogin(); }
  },30000);
}
let LAST_ACTIVITY=Date.now();
function getPatient(id){return DB.patients.find(p=>p.id===id);}

/* ---------- استقبال تسجيل تلقائي قادم من أتمتة Shortcuts (خطوات/نبض) ---------- */
function handleAutoLog(){
  const q=new URLSearchParams(window.location.search);
  if(q.get("autolog")!=="1") return false;
  const code=(q.get("code")||"").trim();
  const p=DB.patients.find(x=>x.accessCode===code);
  if(!p){ renderLogin(); return true; }
  const steps=q.get("steps"), hr=q.get("hr"), sleep=q.get("sleep"), activity=q.get("activity"), cal=q.get("cal");
  const date=todayISO();
  let entry=p.logs.lifestyle.find(x=>x.date===date);
  if(!entry){ entry={date,steps:0,activityMin:0,sleepHrs:0,heartRate:null,calBurned:null,mealNote:"",source:"auto"}; p.logs.lifestyle.push(entry); }
  if(steps!=null && steps!=="") entry.steps=+steps||entry.steps;
  if(hr!=null && hr!=="") entry.heartRate=+hr||entry.heartRate;
  if(sleep!=null && sleep!=="") entry.sleepHrs=+sleep||entry.sleepHrs;
  if(activity!=null && activity!=="") entry.activityMin=+activity||entry.activityMin;
  if(cal!=null && cal!=="") entry.calBurned=+cal||entry.calBurned;
  entry.source="auto";
  saveDB();
  const parts=[steps?`الخطوات: ${steps}`:'',activity?`النشاط: ${activity}د`:'',sleep?`النوم: ${sleep}س`:'',hr?`النبض: ${hr}`:'',cal?`السعرات: ${cal}`:''].filter(Boolean).join(' · ');
  app().innerHTML=`<div class="login-wrap brand-bg center">
    <div style="text-align:center;margin-bottom:10px">${logoSVG('var(--brand-green)',60)}</div>
    <h2 style="color:var(--brand-cream);margin:10px 0 6px">تم الحفظ تلقائيًا ✅</h2>
    <p style="color:rgba(236,231,211,.75);font-size:14px">${esc(p.name)} — ${parts}</p>
    <div style="flex:1"></div>
    <button class="btn fit" onclick="SESSION.role='client';SESSION.pid='${p.id}';SESSION.view='today';${p.consentAccepted?'renderClient()':`renderConsent('${p.id}')`}">فتح التطبيق</button>
  </div>`;
  return true;
}

/* يحوّل رقم الجوال السعودي (بأي صيغة شائعة) إلى الصيغة الدولية اللي يقبلها واتساب */
function normalizePhone(raw){
  let d=(raw||"").replace(/[^\d]/g,"");
  if(!d) return "";
  if(d.startsWith("00")) d=d.slice(2);         // 00966...
  if(d.startsWith("966")) return d;            // صيغة دولية جاهزة
  if(d.startsWith("0")) return "966"+d.slice(1); // 05xxxxxxxx -> 9665xxxxxxxx
  if(d.length===9 && d.startsWith("5")) return "966"+d; // 5xxxxxxxx بدون صفر
  return d;
}

/* ملخص أسبوعي للكارديو والتغذية (مستوحى من ملف المتابعة الأصلي) */
function nutritionCardioCard(p){
  const since=new Date(); since.setDate(since.getDate()-6);
  const sinceISO=since.toISOString().slice(0,10);
  const cardioWk=(p.logs.cardio||[]).filter(x=>x.date>=sinceISO);
  const nutriWk=(p.logs.nutrition||[]).filter(x=>x.date>=sinceISO);
  const cardioMin=cardioWk.reduce((s,x)=>s+x.duration,0), cardioCal=cardioWk.reduce((s,x)=>s+x.calories,0);
  const avgCal=nutriWk.length?Math.round(nutriWk.reduce((s,x)=>s+x.calories,0)/nutriWk.length):null;
  const lastCardio=last(p.logs.cardio), lastNutri=last(p.logs.nutrition);
  const t=p.targets||{};
  const hasTargets=t.calTarget||t.carbsTarget||t.proteinTarget||t.fatTarget;
  return `<div class="card" style="margin-top:14px">
    <div class="sec-title" style="margin-top:0">${I.flask} التغذية والكارديو (آخر ٧ أيام)</div>
    <div class="statgrid" style="margin-bottom:12px">
      <div class="stat"><div class="lbl">كارديو</div><div class="big">${cardioMin}<small> د</small></div><div class="hint">${cardioCal} سعرة محروقة</div></div>
      <div class="stat"><div class="lbl">متوسط السعرات</div><div class="big">${avgCal||'—'}${avgCal?'<small> Cal</small>':''}</div></div>
    </div>
    ${hasTargets?`<div class="card flat" style="background:var(--surface-2);margin-bottom:12px">
      <div class="hint" style="margin-bottom:7px;font-weight:600;color:var(--ink)">${I.target} أهداف الطبيب الغذائية</div>
      ${t.calTarget?`<div class="kvi"><span class="k">السعرات المستهدفة</span><span>${t.calTarget} Cal${avgCal?` <span class="dot ${Math.abs(avgCal-t.calTarget)<=t.calTarget*0.1?'good':'watch'}"></span>`:''}</span></div>`:''}
      ${t.carbsTarget?`<div class="kvi"><span class="k">كاربوهيدرات</span><span>${t.carbsTarget} g</span></div>`:''}

let PAIN_LEVEL="none";
function setPainLevel(lv){
  PAIN_LEVEL=lv;
  ["none","mild","strong"].forEach(k=>{const el=$("#pain_"+k); if(el) el.classList.toggle("on",k===lv);});
}
function saveWorkoutLog(did){
  const p=getPatient(SESSION.pid); const d=p.workoutPlan.days.find(x=>x.id===did);
  const entries=d.exercises.map((e,ei)=>{
    const sets=[];
    for(let s=0;s<(e.sets||3);s++){
      const w=document.querySelector(`[data-ex="${ei}"][data-set="${s}"][data-f="w"]`);
      const r=document.querySelector(`[data-ex="${ei}"][data-set="${s}"][data-f="r"]`);
      const wv=w&&w.value?+w.value:(w&&w.placeholder&&w.placeholder!=='—'?+w.placeholder:null);
      const rv=r&&r.value?+r.value:(r&&r.placeholder&&r.placeholder!=='—'?+r.placeholder:null);
      if(wv||rv) sets.push({w:wv||0,r:rv||0});
    }
    return {name:e.name,sets};
  }).filter(x=>x.sets.length);
  if(!entries.length){alert("سجّل وزنًا أو عدّة واحدة على الأقل");return;}
  const rpe=SEGVAL.seg_rpe||null;
  const painNote=$("#pain_note")?$("#pain_note").value.trim():"";
  p.workoutLogs.push({date:todayISO(),dayId:did,dayName:d.name,entries,rpe,pain:PAIN_LEVEL,painNote});
  SEGVAL={}; PAIN_LEVEL="none";
  saveDB(); SESSION.view="workouts"; renderClient();
}

function deltaCalc(arr,key,invert){ // اتجاه: مقارنة آخر قراءة بأول قراءة
  const s=sortByDate(arr); if(s.length<2)return null;
  const a=key?s[0][key]:s[0].value, b=key?s[s.length-1][key]:s[s.length-1].value;
  const diff=b-a; const cls=diff===0?"flat":((invert?diff<0:diff>0)?"up":"down");
  return{diff:+diff.toFixed(1),cls};
}
function ptOverview(p){
  const g=last(p.logs.glucose),b=last(p.logs.bp),w=last(p.logs.weight),lab=last(p.logs.labs);
  const fl=patientFlags(p), ml=medLoad(p);
  const gd=deltaCalc(p.logs.glucose,null,false), wd=deltaCalc(p.logs.weight,"value",false);
  function statCard(lbl,icon,val,unit,delta,st){
    return `<div class="stat"><div class="lbl">${icon} ${lbl}</div>
      <div class="big">${val!=null?val:'<span class="faint">—</span>'}${unit?` <small>${unit}</small>`:''} ${st?`<span class="dot ${st}" style="vertical-align:middle"></span>`:''}</div>
      ${delta?`<div class="delta ${delta.cls}">${delta.diff>0?'▲':delta.diff<0?'▼':'■'} ${Math.abs(delta.diff)} ${delta.cls==='down'?'(تحسّن)':delta.cls==='up'?'(ارتفاع)':''}</div>`:''}</div>`;
  }
  let banner="";
  if(fl.length) banner=`<div class="banner alert">${I.warn}<div><b>تنبيه:</b> آخر قراءة ${fl.join(" و")} خارج النطاق الآمن. يُنصح بالمراجعة.</div></div>`;
  const actions=`<div class="row" style="margin-bottom:14px">
    <button class="btn wa sm" style="flex:1" onclick="waShare('${p.id}')">${I.wa} مشاركة الدخول واتساب</button>
    <button class="btn line sm" style="flex:none;width:auto" onclick="patientForm('${p.id}')">تعديل البيانات</button>
  </div>`;
  return banner+actions+`<div class="statgrid">
    ${statCard("سكر صائم",I.drop,g?g.value:null,"mg/dL",gd,g?glucoseStatus(g.value,g.type,p.targets)[0]:null)}
    ${statCard("الضغط",I.heart,b?b.sys+"/"+b.dia:null,"",null,b?bpStatus(b.sys,b.dia)[0]:null)}
    ${statCard("الوزن",I.scale,w?w.value:null,"كجم",wd,null)}
    ${statCard("HbA1c",I.flask,lab?lab.hba1c:null,"%",deltaCalc(p.logs.labs,"hba1c",false),lab?(lab.hba1c<=p.targets.hba1c?"good":"watch"):null)}
  </div>
  <div class="card">
    <div class="sec-title" style="margin-top:0">${I.pill} حِمل الدواء</div>
    <div class="chips">
      <span class="chip pri">${ml.active} فعّال</span>
      ${ml.reduced?`<span class="chip acc">${ml.reduced} مُخفّض</span>`:''}
      ${ml.stopped?`<span class="chip good">${ml.stopped} موقوف</span>`:''}
    </div>
    ${ml.stopped+ml.reduced>0?`<div class="hint" style="margin-top:9px">رحلة التقليل: تم تخفيف/إيقاف ${ml.stopped+ml.reduced} من أصل ${ml.total} أدوية 👏</div>`:''}
  </div>
  <div class="card"><div class="sec-title" style="margin-top:0">${I.drop} اتجاه السكر الصائم</div>
    ${lineChart({values:sortByDate(p.logs.glucose).filter(x=>x.type==='fasting').map(x=>({x:fmtD(x.date),y:x.value})),bandMin:p.targets.fbgMin,bandMax:p.targets.fbgMax,unit:"",color:"#13564b"})}
  </div>
  <div class="card"><div class="sec-title" style="margin-top:0">${I.heart} اتجاه الضغط الانقباضي</div>
    ${lineChart({values:sortByDate(p.logs.bp).map(x=>({x:fmtD(x.date),y:x.sys})),bandMax:p.targets.sbp,bandMin:90,color:"#c0442d"})}
  </div>`;
}

  ${histCard(p,"bp","قراءات الضغط",x=>`${x.sys}/${x.dia}`,(x)=>bpStatus(x.sys,x.dia))}

function histCard(p,key,title,fmt,statusFn){
  const arr=sortByDate(p.logs[key]).slice(-6).reverse();
  return `<div class="card"><div class="sec-title" style="margin-top:0">${title}
    <button class="btn ghost sm" style="margin-inline-start:auto" onclick="logSheet('${p.id}','${key}')">${I.plus} إضافة</button></div>
    ${arr.length?arr.map(x=>{
      let st=null; if(statusFn){ st=key==='glucose'?statusFn(x.value,x.type,p)[0]:statusFn(x)[0]; }
      return `<div class="kvi"><span class="k">${fmtDFull(x.date)}</span><span>${st?`<span class="dot ${st}"></span> `:''}${fmt(x)}</span></div>`;
    }).join(""):'<div class="empty">لا توجد قراءات</div>'}
  </div>`;
}

/* طلب سبب التغيير قبل تحديث حالة الدواء — يُبنى منه سجل توقيع دائم */
function askMedStatus(pid,mid,st){
  const p=getPatient(pid); const m=p.meds.find(x=>x.id===mid);
  if(m.status===st){return;}
  const lbl={active:"فعّال",reduced:"مُخفّض",stopped:"موقوف"};
  const g=last(p.logs.glucose),b=last(p.logs.bp),lab=last(p.logs.labs);
  openSheet(`<h3>تغيير حالة: ${esc(m.name)}</h3>
    <p class="hint" style="margin-bottom:10px">من «${lbl[m.status]}» إلى «${lbl[st]}». اذكر السبب السريري — يُحفظ في سجل الدواء بشكل دائم.</p>
    <div class="card flat" style="background:var(--surface-2);margin-bottom:12px">
      <div class="kvi"><span class="k">آخر سكر صائم</span><span>${g?g.value+" mg/dL ("+fmtD(g.date)+")":"—"}</span></div>
      <div class="kvi"><span class="k">آخر ضغط</span><span>${b?b.sys+"/"+b.dia+" ("+fmtD(b.date)+")":"—"}</span></div>
      <div class="kvi"><span class="k">آخر HbA1c</span><span>${lab?lab.hba1c+"% ("+fmtD(lab.date)+")":"—"}</span></div>
    </div>
    <div class="field"><label>السبب / الأساس السريري</label><textarea id="mh_reason" rows="3" placeholder="مثال: تحسّن HbA1c إلى 7.2% مع التزام جيد بالنمط الغذائي"></textarea></div>
    <button class="btn" onclick="commitMedStatus('${pid}','${mid}','${st}')">تأكيد وحفظ في السجل</button>`);
}
function commitMedStatus(pid,mid,st){
  const reason=$("#mh_reason").value.trim();
  if(!reason){alert("اذكر السبب قبل الحفظ — هذا يُبنى منه سجل التوقيع الطبي");return;}
  const p=getPatient(pid); const m=p.meds.find(x=>x.id===mid);
  const g=last(p.logs.glucose),b=last(p.logs.bp),lab=last(p.logs.labs);
  if(!m.history) m.history=[];
  m.history.push({date:todayISO(),from:m.status,to:st,reason,
    snapshot:{glucose:g?g.value:null,bp:b?`${b.sys}/${b.dia}`:null,hba1c:lab?lab.hba1c:null}});
  m.status=st; m.updatedAt=todayISO();
  saveDB(); closeSheet();
  (SESSION.role==='doctor'?renderPatient():renderClient());
}
function medHistory(pid,mid){
  const p=getPatient(pid); const m=p.meds.find(x=>x.id===mid);
  const lbl={active:"فعّال",reduced:"مُخفّض",stopped:"موقوف"};

/* رابط الربط التلقائي: يحمل رمز دخول المريض + رابط التطبيق، ليُستخدم داخل Shortcut في آيفون */
function autoLogUrl(p){
  const base=DB.clinic.appUrl||"(احفظ رابط التطبيق أولًا من الإعدادات)";
  return `${base}?autolog=1&code=${encodeURIComponent(p.accessCode)}&steps=STEPS&activity=ACTIVITY&hr=HR&cal=CAL`;
}
function copyAutoLink(pid){
  const p=getPatient(pid);
  if(!DB.clinic.appUrl){alert("احفظ رابط التطبيق أولًا من تبويب الإعدادات");return;}
  const url=autoLogUrl(p);
  const done=()=>alert("تم نسخ الرابط. الصقه بإجراء «Open URLs» جوا الأتمتة، واستبدل كل كلمة كبيرة (STEPS, ACTIVITY, HR, CAL) بنتيجة إجراء Calculate Statistics المطابق لها.");
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done).catch(()=>{prompt("انسخ الرابط:",url);});}
  else{prompt("انسخ الرابط:",url);}
}
function autoLinkGuide(){

    <div class="kvi"><span class="k">١</span><span>افتح تطبيق <b>Shortcuts</b> ← تبويب <b>Automation</b> ← <b>+</b> ← <b>Create Personal Automation</b>.</span></div>

function ptWellbeing(p){
  const w=last(p.logs.wellbeing);
  const faces=["😣","😕","😐","🙂","😄"];
  return `<div class="statgrid">
    <div class="stat"><div class="lbl">${I.battery} الطاقة</div><div class="big">${w?faces[w.energy-1]+" "+w.energy+"/5":'—'}</div></div>
    <div class="stat"><div class="lbl">${I.warn} الإجهاد/التعب</div><div class="big">${w?faces[5-w.fatigue]+" "+w.fatigue+"/5":'—'}</div></div>
  </div>
  <div class="card"><div class="sec-title" style="margin-top:0">اتجاه الطاقة</div>
    ${lineChart({values:sortByDate(p.logs.wellbeing).map(x=>({x:fmtD(x.date),y:x.energy})),color:"#d98e48",bandMin:1,bandMax:5})}</div>
  <div class="card"><div class="sec-title" style="margin-top:0">سجل الإحساس</div>
    ${sortByDate(p.logs.wellbeing).slice(-6).reverse().map(x=>`<div class="kvi"><span class="k">${fmtDFull(x.date)}</span><span>طاقة ${faces[x.energy-1]} · تعب ${x.fatigue}/5${x.note?' · '+esc(x.note):''}</span></div>`).join("")||'<div class="empty">لا يوجد</div>'}</div>
  <button class="btn ghost" onclick="logSheet('${p.id}','wellbeing')">${I.plus} تسجيل الإحساس</button>`;
}
function ptNotes(p){
  return `<button class="btn" style="margin-bottom:14px" onclick="noteForm('${p.id}')">${I.plus} ملاحظة جديدة</button>
    ${sortByDate(p.notes).reverse().map(n=>`<div class="card"><div class="hint" style="margin:0 0 6px">${fmtDFull(n.date)}</div>${esc(n.text)}</div>`).join("")||'<div class="empty">لا توجد ملاحظات</div>'}`;
}
function noteForm(pid){
  openSheet(`<h3>ملاحظة طبية</h3><div class="field"><textarea id="n_txt" rows="4" placeholder="الخطة، الملاحظات، التوصيات…"></textarea></div>
    <button class="btn" onclick="saveNote('${pid}')">حفظ</button>`);
}
function saveNote(pid){const t=$("#n_txt").value.trim();if(!t)return;getPatient(pid).notes.push({date:todayISO(),text:t});saveDB();closeSheet();renderPatient();}

/* ---------- أوراق إدخال القياسات (مشتركة) ---------- */
let LOG_GTYPE="fasting";
function logSheet(pid,kind){
  const today=todayISO();
  let body="";
  if(kind==="glucose"){
    LOG_GTYPE="fasting";
    body=`<h3>تسجيل السكر</h3>
      <div class="seg"><button class="active" id="gt_f" onclick="LOG_GTYPE='fasting';this.classList.add('active');$('#gt_p').classList.remove('active')">صائم</button>
        <button id="gt_p" onclick="LOG_GTYPE='post';this.classList.add('active');$('#gt_f').classList.remove('active')">بعد الأكل</button></div>
      <div class="field"><label>القراءة (mg/dL)</label><input id="lv" type="number" inputmode="decimal" autofocus></div>
      <div class="field"><label>التاريخ</label><input id="ld" type="date" value="${today}"></div>`;
  }else if(kind==="bp"){
    body=`<h3>تسجيل الضغط</h3>
      <div class="row"><div class="field"><label>الانقباضي</label><input id="lv1" type="number" inputmode="numeric"></div>
        <div class="field"><label>الانبساطي</label><input id="lv2" type="number" inputmode="numeric"></div>
        <div class="field"><label>النبض</label><input id="lv3" type="number" inputmode="numeric"></div></div>
      <div class="field"><label>التاريخ</label><input id="ld" type="date" value="${today}"></div>`;
  }else if(kind==="weight"){
    body=`<h3>تسجيل الوزن</h3>
      <div class="row"><div class="field"><label>الوزن (كجم)</label><input id="lv1" type="number" inputmode="decimal" step="0.1"></div>
        <div class="field"><label>محيط الخصر (سم)</label><input id="lv2" type="number" inputmode="numeric"></div></div>
      <div class="field"><label>التاريخ</label><input id="ld" type="date" value="${today}"></div>`;
  }else if(kind==="labs"){
    body=`<h3>تحليل مخبري</h3>
      <div class="row"><div class="field"><label>HbA1c %</label><input id="lv1" type="number" step="0.1"></div>
        <div class="field"><label>LDL</label><input id="lv2" type="number"></div></div>
      <div class="row"><div class="field"><label>HDL</label><input id="lv3" type="number"></div>
        <div class="field"><label>دهون ثلاثية</label><input id="lv4" type="number"></div>
        <div class="field"><label>كلي</label><input id="lv5" type="number"></div></div>
      <div class="field"><label>فيتامين د (ng/mL)</label><input id="lv7" type="number" step="0.1" placeholder="مثال: 18"></div>
      <div class="row"><div class="field"><label>TSH</label><input id="lv8" type="number" step="0.01" placeholder="mIU/L"></div>
        <div class="field"><label>T3</label><input id="lv9" type="number" step="0.01"></div>
        <div class="field"><label>T4</label><input id="lv10" type="number" step="0.01"></div></div>
      <div class="field"><label>التاريخ</label><input id="ld" type="date" value="${today}"></div>`;
  }else if(kind==="lifestyle"){
    body=`<h3>نمط اليوم</h3>
      <div class="row"><div class="field"><label>الخطوات</label><input id="lv1" type="number"></div>
        <div class="field"><label>نشاط (دقيقة)</label><input id="lv2" type="number"></div></div>
      <div class="row"><div class="field"><label>النوم (ساعة)</label><input id="lv3" type="number" step="0.5"></div>
        <div class="field"><label>نبضات القلب (استراحة)</label><input id="lv4" type="number" placeholder="مثال: 72"></div></div>
      <div class="field"><label>السعرات المحروقة (نشاط)</label><input id="lv6" type="number" placeholder="مثال: 420"></div>
      <div class="field"><label>ملاحظة عن الأكل</label><input id="lv5" placeholder="مثال: التزمت بالحمية"></div>
      <div class="field"><label>التاريخ</label><input id="ld" type="date" value="${today}"></div>`;
  }else if(kind==="wellbeing"){
    body=`<h3>إحساسك اليوم</h3>
      <div class="field"><label>مستوى الطاقة (1 منخفض – 5 ممتاز)</label>
        <div class="seg" id="seg_e">${[1,2,3,4,5].map(n=>`<button onclick="pickSeg('seg_e',${n})" data-v="${n}">${["😣","😕","😐","🙂","😄"][n-1]}</button>`).join("")}</div></div>
      <div class="field"><label>مستوى التعب/الإجهاد (1 لا يوجد – 5 شديد)</label>
        <div class="seg" id="seg_f">${[1,2,3,4,5].map(n=>`<button onclick="pickSeg('seg_f',${n})" data-v="${n}">${n}</button>`).join("")}</div></div>
      <div class="field"><label>ملاحظة (اختياري)</label><input id="lv5" placeholder="كيف كان يومك؟"></div>
      <div class="field"><label>التاريخ</label><input id="ld" type="date" value="${today}"></div>`;
  }else if(kind==="cardio"){
    body=`<h3>تسجيل كارديو</h3>
      <div class="field"><label>النوع</label><select id="lv1"><option>مشي</option><option>إليبتيكال</option><option>جري</option><option>دراجة</option><option>سباحة</option><option>أخرى</option></select></div>
      <div class="row"><div class="field"><label>المدة (دقيقة)</label><input id="lv2" type="number"></div>
        <div class="field"><label>السعرات المحروقة</label><input id="lv3" type="number"></div></div>
      <div class="field"><label>التاريخ</label><input id="ld" type="date" value="${today}"></div>`;
  }else if(kind==="nutrition"){
    body=`<h3>تسجيل التغذية اليومية</h3>
      <div class="field"><label>السعرات الكلية</label><input id="lv1" type="number"></div>
      <div class="row"><div class="field"><label>كاربوهيدرات (g)</label><input id="lv2" type="number"></div>
        <div class="field"><label>بروتين (g)</label><input id="lv3" type="number"></div>
        <div class="field"><label>دهون (g)</label><input id="lv4" type="number"></div></div>
      <div class="field"><label>التاريخ</label><input id="ld" type="date" value="${today}"></div>`;
  }
  openSheet(body+`<button class="btn" onclick="saveLog('${pid}','${kind}')">حفظ</button>`);
}
let SEGVAL={};
function pickSeg(id,v){SEGVAL[id]=v;document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('active',+b.dataset.v===v));}
function saveLog(pid,kind){
  const p=getPatient(pid); const date=$("#ld").value||todayISO(); let rec;
  if(kind==="glucose"){const v=+$("#lv").value;if(!v){alert("أدخل القراءة");return;}rec={date,value:v,type:LOG_GTYPE==='fasting'?'fasting':'post'};p.logs.glucose.push(rec);}
  else if(kind==="bp"){const s=+$("#lv1").value,d=+$("#lv2").value;if(!s||!d){alert("أدخل القراءة");return;}p.logs.bp.push({date,sys:s,dia:d,pulse:+$("#lv3").value||null});}
  else if(kind==="weight"){const v=+$("#lv1").value;if(!v){alert("أدخل الوزن");return;}p.logs.weight.push({date,value:v,waist:+$("#lv2").value||null});}
  else if(kind==="labs"){p.logs.labs.push({date,hba1c:+$("#lv1").value||null,ldl:+$("#lv2").value||null,hdl:+$("#lv3").value||null,tg:+$("#lv4").value||null,tc:+$("#lv5").value||null,vitaminD:+$("#lv7").value||null,tsh:+$("#lv8").value||null,t3:+$("#lv9").value||null,t4:+$("#lv10").value||null});}
  else if(kind==="lifestyle"){p.logs.lifestyle.push({date,steps:+$("#lv1").value||0,activityMin:+$("#lv2").value||0,sleepHrs:+$("#lv3").value||0,heartRate:+$("#lv4").value||null,calBurned:+$("#lv6").value||null,mealNote:$("#lv5").value.trim(),source:"manual"});}
  else if(kind==="wellbeing"){p.logs.wellbeing.push({date,energy:SEGVAL.seg_e||3,fatigue:SEGVAL.seg_f||3,mood:"",note:$("#lv5").value.trim()});SEGVAL={};}
  else if(kind==="cardio"){p.logs.cardio.push({date,type:$("#lv1").value,duration:+$("#lv2").value||0,calories:+$("#lv3").value||0});}
  else if(kind==="nutrition"){p.logs.nutrition.push({date,calories:+$("#lv1").value||0,carbs:+$("#lv2").value||0,protein:+$("#lv3").value||0,fat:+$("#lv4").value||0});}
  saveDB();closeSheet();
  if(SESSION.role==="doctor")renderPatient(); else renderClient();
}

function homeScreenHint(){
  try{
    var isStandalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if(isStandalone) return "";
    if(localStorage.getItem('medfit_hide_a2hs')) return "";
  }catch(e){ return ""; }
  return `<div class="banner note" id="a2hsHint" style="align-items:flex-start">
    <span style="font-size:18px;line-height:1">📲</span>
    <div><b>نصيحة:</b> أضف Med Fit لشاشتك الرئيسية عشان تفتحه بسرعة كتطبيق — اضغط زر المشاركة ⬆️ بالأسفل، ثم "Add to Home Screen".
    <button type="button" onclick="dismissA2HS()" style="display:block;margin-top:7px;font-size:12.5px;color:var(--primary);font-weight:700">فهمت، لا تظهر مرة ثانية</button></div></div>`;
}
function dismissA2HS(){
  try{ localStorage.setItem('medfit_hide_a2hs','1'); }catch(e){}
  const el=document.getElementById('a2hsHint'); if(el) el.remove();
}
function renderClient(){
  FREEZE_SYNC=false;
  CURRENT_RENDER=renderClient;
  const p=getPatient(SESSION.pid); if(!p){renderLogin();return;}
  let body="";
  if(SESSION.view==="today") body=clToday(p);
  else if(SESSION.view==="progress") body=clProgress(p);
  else if(SESSION.view==="workouts") body=clWorkouts(p);
  else if(SESSION.view==="plan") body=clPlan(p);
  app().innerHTML=header("مرحبًا "+p.name.split(" ")[0],"رحلتك نحو نمط أصحّ")
    +`<div class="wrap">${homeScreenHint()}${body}</div>`
    +bnav([
      {v:"today",icon:I.plus,label:"اليوم",fn:"SESSION.view='today';renderClient()"},
      {v:"progress",icon:I.chart,label:"تقدّمي",fn:"SESSION.view='progress';renderClient()"},
      {v:"workouts",icon:I.dumbbell,label:"تماريني",fn:"SESSION.view='workouts';renderClient()"},
      {v:"plan",icon:I.pill,label:"خطتي",fn:"SESSION.view='plan';renderClient()"}
    ]);
}
function clToday(p){
  const fl=patientFlags(p);
  const streak=computeStreak(p);
  let banner="";
  if(fl.length) banner=`<div class="banner alert">${I.warn}<div><b>انتبه:</b> آخر قراءة (${fl.join(" / ")}) خارج النطاق الآمن. تواصل مع طبيبك، وإن وُجدت أعراض شديدة فاطلب الطوارئ.</div></div>`;
  const items=[
    ["glucose",I.drop,"السكر","سجّل قراءتك","#13564b","#e4efeb"],
    ["bp",I.heart,"الضغط","انقباضي/انبساطي","#c0442d","#f8e4de"],
    ["weight",I.scale,"الوزن","الوزن والخصر","#1d7163","#e2f1ec"],
    ["lifestyle",I.spark,"النمط","خطوات/نوم/نبض","#d98e48","#f7ecdd"],
    ["wellbeing",I.battery,"إحساسي","طاقتك وتعبك","#bf8420","#f7eed8"],
  ];
  return banner+`<div class="card flat" style="background:var(--primary);color:#fff;border:none">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div><div style="font-size:13px;opacity:.85">اليوم · ${fmtDFull(todayISO())}</div>
        <div style="font-size:16px;font-weight:600;margin-top:4px">سجّل قياساتك باستمرار — كل قراءة تقرّبك من هدفك 🌿</div></div>
        ${streak>0?`<div style="text-align:center;background:rgba(255,255,255,.15);border-radius:14px;padding:8px 12px;flex:none">
          <div style="color:#ffb648">${I.flame}</div><div style="font-weight:700;font-size:15px">${streak}</div><div style="font-size:9.5px;opacity:.8">يوم متتالي</div></div>`:''}
      </div>
    </div>
    <div class="sec-title">تسجيل سريع</div>
    <div class="qgrid">${items.map(([k,ic,t,s,c,bg])=>`
      <button class="qcard" onclick="logSheet('${p.id}','${k}')">
        <span class="qic" style="background:${bg};color:${c}">${ic}</span>
        <div><div class="qt">${t}</div><div class="qs">${s}</div></div>
      </button>`).join("")}
      <button class="qcard" onclick="SESSION.view='plan';renderClient()">
        <span class="qic" style="background:var(--surface-2);color:var(--primary)">${I.pill}</span>
        <div><div class="qt">أدويتي</div><div class="qs">عرض خطتك</div></div>
      </button>
    </div>`;
}
function clProgress(p){
  const g=last(p.logs.glucose),lab=last(p.logs.labs),w=last(p.logs.weight);
  const gd=deltaCalc(p.logs.glucose,null,false);
  let msg="استمر — كل خطوة تُحدث فرقًا.";
  if(gd&&gd.cls==='down') msg=`سكرك الصائم تحسّن بمقدار ${Math.abs(gd.diff)} mg/dL منذ البداية 🎉`;
  const ml=medLoad(p);
  return `<div class="card flat" style="background:var(--good-soft);border:none">
      <div style="font-weight:600;color:var(--good)">${msg}</div>
      ${ml.reduced+ml.stopped>0?`<div class="hint" style="margin-top:6px;color:#1d6a54">بمساعدة طبيبك، تم تخفيف/إيقاف ${ml.reduced+ml.stopped} من أدويتك.</div>`:''}
    </div>
    <div class="card"><div class="sec-title" style="margin-top:0">${I.drop} السكر الصائم</div>
      ${lineChart({values:sortByDate(p.logs.glucose).filter(x=>x.type==='fasting').map(x=>({x:fmtD(x.date),y:x.value})),bandMin:p.targets.fbgMin,bandMax:p.targets.fbgMax,color:"#13564b"})}
      <div class="hint">المنطقة المظللة = نطاق هدفك (${p.targets.fbgMin}–${p.targets.fbgMax}).</div></div>
    <div class="card"><div class="sec-title" style="margin-top:0">${I.heart} الضغط الانقباضي</div>
      ${lineChart({values:sortByDate(p.logs.bp).map(x=>({x:fmtD(x.date),y:x.sys})),bandMax:p.targets.sbp,bandMin:90,color:"#c0442d"})}</div>
    <div class="card"><div class="sec-title" style="margin-top:0">${I.scale} الوزن</div>
      ${lineChart({values:sortByDate(p.logs.weight).map(x=>({x:fmtD(x.date),y:x.value})),bandMax:p.targets.weight||undefined,color:"#1d7163"})}</div>
    ${lab?`<div class="card"><div class="sec-title" style="margin-top:0">${I.flask} آخر تحاليلك</div>
      <div class="kvi"><span class="k">التراكمي HbA1c</span><span>${lab.hba1c}%</span></div>
      <div class="kvi"><span class="k">الكوليسترول الضار</span><span>${lab.ldl}</span></div>
      ${lab.vitaminD!=null?`<div class="kvi"><span class="k">فيتامين د</span><span>${lab.vitaminD} ng/mL</span></div>`:''}
      ${lab.tsh!=null?`<div class="kvi"><span class="k">TSH</span><span>${lab.tsh}</span></div>`:''}
      ${lab.t3!=null?`<div class="kvi"><span class="k">T3</span><span>${lab.t3}</span></div>`:''}
      ${lab.t4!=null?`<div class="kvi"><span class="k">T4</span><span>${lab.t4}</span></div>`:''}
      <div class="hint" style="margin-top:6px">${fmtDFull(lab.date)}</div></div>`:''}
    <div class="card"><div class="sec-title" style="margin-top:0">${I.spark} خطواتك</div>
      ${lineChart({values:sortByDate(p.logs.lifestyle).map(x=>({x:fmtD(x.date),y:x.steps})),color:"#1d7163"})}</div>
    <div class="card"><div class="sec-title" style="margin-top:0">${I.flame} سعراتك المحروقة</div>
      ${lineChart({values:sortByDate(p.logs.lifestyle).filter(x=>x.calBurned).map(x=>({x:fmtD(x.date),y:x.calBurned})),color:"#d98e48"})}</div>
    <div class="card"><div class="sec-title" style="margin-top:0">${I.heart} نبض الاستراحة</div>
      ${lineChart({values:sortByDate(p.logs.lifestyle).filter(x=>x.heartRate).map(x=>({x:fmtD(x.date),y:x.heartRate})),color:"#c0442d"})}</div>
    <div class="card"><div class="sec-title" style="margin-top:0">${I.battery} طاقتك</div>
      ${lineChart({values:sortByDate(p.logs.wellbeing).map(x=>({x:fmtD(x.date),y:x.energy})),bandMin:1,bandMax:5,color:"#d98e48"})}</div>`;
}
function clPlan(p){
  return `<button class="btn wa" style="margin-bottom:14px" onclick="waDoctor()">${I.wa} تواصل مع طبيبك عبر واتساب</button>
    <div class="banner note">${I.shield}<div>هذا التطبيق للمتابعة فقط. <b>أي تعديل على دوائك يكون بقرار طبيبك المعالج.</b></div></div>
    <div class="sec-title" style="margin-top:0">${I.pill} أدويتي الحالية</div>
    ${ptMeds(p,false)}
    <div class="sec-title">${I.note} من طبيبك</div>
    ${p.notes.length?sortByDate(p.notes).reverse().slice(0,3).map(n=>`<div class="card"><div class="hint" style="margin:0 0 5px">${fmtDFull(n.date)}</div>${esc(n.text)}</div>`).join(""):`<div class="card"><div class="hint" style="margin:0 0 5px">رسالة ترحيب</div>أهلًا ${esc(p.name.split(" ")[0])} 👋 وصلتني بياناتك وبإذن الله نبدأ رحلتك معًا. سجّل قياساتك أول بأول وراح أتابعها وأضبط خطتك حسب تقدّمك.</div>`}
    <div class="sec-title">${I.target} أهدافك</div>
    <div class="card">
      <div class="kvi"><span class="k">سكر صائم</span><span>${p.targets.fbgMin}–${p.targets.fbgMax} mg/dL</span></div>
      <div class="kvi"><span class="k">التراكمي</span><span>≤ ${p.targets.hba1c}%</span></div>
      <div class="kvi"><span class="k">الضغط</span><span>≤ ${p.targets.sbp}/${p.targets.dbp}</span></div>
      ${p.targets.weight?`<div class="kvi"><span class="k">الوزن</span><span>${p.targets.weight} كجم</span></div>`:''}
      ${p.targets.calTarget?`<div class="kvi"><span class="k">السعرات اليومية</span><span>${p.targets.calTarget} Cal</span></div>`:''}
      ${p.targets.carbsTarget?`<div class="kvi"><span class="k">كاربوهيدرات</span><span>${p.targets.carbsTarget} g</span></div>`:''}
      ${p.targets.proteinTarget?`<div class="kvi"><span class="k">بروتين</span><span>${p.targets.proteinTarget} g</span></div>`:''}
      ${p.targets.fatTarget?`<div class="kvi"><span class="k">دهون</span><span>${p.targets.fatTarget} g</span></div>`:''}
    </div>`;
}

/* ---------- Sheet helpers ---------- */
function openSheet(html){
  const s=document.createElement("div");s.className="scrim";s.id="scrim";
  s.onclick=e=>{if(e.target===s)closeSheet();};
  s.innerHTML=`<div class="sheet"><div class="grip"></div>${html}</div>`;
  document.body.appendChild(s);
}
function closeSheet(){const s=$("#scrim");if(s)s.remove();}

/* fix: تنظيف خطأ نصي بسيط في statusbar (placeholder) */
init();
</script>
</body>
</html>
